<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>솔리데오의 은밀한 연회</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f3ebdc; color: #604326; font-family: system-ui, sans-serif; }
main { width: min(100%, 794px); margin: auto; }
nav { display: flex; justify-content: center; gap: 4px; padding: 8px; }
button { border: 0; background: transparent; color: inherit; font: inherit; padding: 10px 16px; min-height: 44px; cursor: pointer; border-radius: 24px; }
button[aria-current="page"] { color: white; background: #725334; }
section { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
section::-webkit-scrollbar { display: none; }
img { display: block; width: 100%; flex: 0 0 100%; min-width: 0; height: auto; scroll-snap-align: start; scroll-snap-stop: always; }
@media (min-width: 700px) { main { width: min(794px, max(445px, calc((100vh - 76px) * .707))); } }
</style>
</head>
<body>
<main aria-label="솔리데오 홈커밍데이">
<nav aria-label="안내장 선택">
<button aria-current="page">회장 환영사</button><button>식순</button><button>메뉴</button>
</nav>
<section tabindex="0" aria-label="홈커밍데이 안내장">
<img width="794" height="1123" alt="회장 환영사 · 솔리데오 청년부 김유진 회장" src="welcome.jpg">
<img width="794" height="1123" alt="식순" src="schedule.jpg">
<img width="794" height="1123" alt="메뉴" src="menu.jpg">
</section>
</main>
<script>
const gallery = document.querySelector('section');
const buttons = [...document.querySelectorAll('button')];
function currentPage() {
  return Math.round(gallery.scrollLeft / gallery.clientWidth);
}
function showPage(index) {
  gallery.scrollLeft = index * gallery.clientWidth;
}
buttons.forEach((button, index) => button.addEventListener('click', () => showPage(index)));
gallery.addEventListener('scroll', () => {
  buttons.forEach((button, index) => {
    if (index === currentPage()) button.setAttribute('aria-current', 'page');
    else button.removeAttribute('aria-current');
  });
});
document.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    showPage(currentPage() + (event.key === 'ArrowRight' ? 1 : -1));
  }
});
</script>
</body>
</html>
